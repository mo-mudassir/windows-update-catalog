name: Publish reviewed catalog

# Runs when a reviewed catalog lands on main, for example after merging a catalog-review pull request.
on:
  push:
    branches: [main]
    paths: [tool/release_catalog.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        run: |
          python3 tool/publish.py | tee publish.log
          if grep -q '^Published' publish.log; then
            git config user.name "catalog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog manifest.json
            git commit -m "Publish catalog: $(head -c 200 publish.log)"
            git push
          fi
